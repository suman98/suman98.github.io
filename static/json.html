<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Viewer</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a;
    --border: #2e3347; --accent: #6c8ef5; --accent2: #a78bfa;
    --text: #e2e8f0; --muted: #64748b; --success: #34d399;
    --warn: #f59e0b; --err: #f87171; --str: #86efac;
    --num: #fbbf24; --bool: #60a5fa; --null: #f87171; --key: #c4b5fd;
    --hl: rgba(108,142,245,0.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  header { padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .logo { font-weight: 700; font-size: 16px; color: var(--accent); letter-spacing: 0.5px; white-space: nowrap; }
  .logo span { color: var(--accent2); }

  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1; }
  button { border: 1px solid var(--border); background: var(--surface2); color: var(--text); padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: all .15s; white-space: nowrap; }
  button:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger:hover { background: var(--err); border-color: var(--err); }

  .search-wrap { display: flex; align-items: center; gap: 6px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; flex: 1; min-width: 160px; max-width: 320px; }
  .search-wrap input { background: none; border: none; color: var(--text); outline: none; font-size: 13px; width: 100%; }
  .search-wrap input::placeholder { color: var(--muted); }
  .search-count { font-size: 11px; color: var(--muted); white-space: nowrap; }

  .main { display: flex; flex: 1; overflow: hidden; }

  .input-pane { width: 340px; min-width: 200px; display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
  .pane-header { padding: 8px 12px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  textarea { flex: 1; background: transparent; color: var(--text); border: none; outline: none; padding: 12px; font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 13px; resize: none; line-height: 1.6; }

  .output-pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .output-body { flex: 1; overflow: auto; padding: 12px 16px; }

  /* Tree view */
  .tree { font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 13px; line-height: 1.8; }
  .node { display: flex; flex-direction: column; }
  .node-row { display: flex; align-items: flex-start; gap: 4px; padding: 1px 0; border-radius: 4px; cursor: default; }
  .node-row:hover { background: rgba(255,255,255,0.04); }
  .node-row.highlighted { background: var(--hl) !important; outline: 1px solid var(--accent); }
  .children { padding-left: 20px; border-left: 1px solid var(--border); margin-left: 8px; }
  .toggle { width: 16px; height: 16px; cursor: pointer; color: var(--muted); flex-shrink: 0; font-size: 10px; display: flex; align-items: center; justify-content: center; user-select: none; transition: transform .15s; }
  .toggle:hover { color: var(--accent); }
  .collapsed > .children { display: none; }
  .key { color: var(--key); }
  .colon { color: var(--muted); margin: 0 2px; }
  .str { color: var(--str); }
  .num { color: var(--num); }
  .bool { color: var(--bool); }
  .null { color: var(--null); font-style: italic; }
  .bracket { color: var(--muted); }
  .count-badge { font-size: 10px; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); padding: 0 5px; border-radius: 10px; margin-left: 4px; }
  mark { background: rgba(251,191,36,.35); color: inherit; border-radius: 2px; padding: 0 1px; }

  /* Table view */
  .table-wrap { overflow: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; font-family: 'Cascadia Code', 'Fira Code', monospace; }
  th { background: var(--surface2); color: var(--accent); padding: 8px 14px; text-align: left; border: 1px solid var(--border); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; position: sticky; top: 0; }
  td { padding: 7px 14px; border: 1px solid var(--border); vertical-align: top; max-width: 300px; overflow: hidden; text-overflow: ellipsis; }
  tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
  tr:hover td { background: rgba(108,142,245,0.08); }

  /* Raw view */
  pre { font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 13px; line-height: 1.7; white-space: pre-wrap; word-break: break-all; }

  /* Status bar */
  .statusbar { padding: 5px 16px; background: var(--surface); border-top: 1px solid var(--border); font-size: 11px; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }
  .status-ok { color: var(--success); }
  .status-err { color: var(--err); }

  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--muted); gap: 12px; }
  .empty-icon { font-size: 48px; opacity: .3; }

  .view-tabs { display: flex; gap: 4px; }
  .resizer { width: 4px; background: var(--border); cursor: col-resize; flex-shrink: 0; transition: background .15s; }
  .resizer:hover { background: var(--accent); }

  @media (max-width: 640px) { .input-pane { width: 100%; border-right: none; border-bottom: 1px solid var(--border); height: 200px; } .main { flex-direction: column; } }
</style>
</head>
<body>

<header>
  <div class="logo">JSON<span>Viewer</span></div>
  <div class="toolbar">
    <div class="view-tabs">
      <button class="active" id="btn-tree" onclick="setView('tree')">🌲 Tree</button>
      <button id="btn-table" onclick="setView('table')">📋 Table</button>
      <button id="btn-raw" onclick="setView('raw')">📄 Raw</button>
    </div>
    <button onclick="beautify()">✨ Beautify</button>
    <button onclick="collapseAll()">⊟ Collapse All</button>
    <button onclick="expandAll()">⊞ Expand All</button>
    <button class="danger" onclick="clearAll()">🗑 Clear</button>
    <div class="search-wrap">
      <span style="color:var(--muted);font-size:13px">🔍</span>
      <input id="search" placeholder="Search keys or values…" oninput="onSearch(this.value)">
      <span class="search-count" id="search-count"></span>
    </div>
  </div>
</header>

<div class="main" id="main">
  <div class="input-pane" id="input-pane">
    <div class="pane-header">
      <span>Input JSON</span>
      <button style="padding:2px 8px;font-size:11px" onclick="loadSample()">Load Sample</button>
    </div>
    <textarea id="json-input" placeholder='Paste your JSON here…&#10;&#10;e.g. {"name":"Alice","age":30}'
      oninput="onInput()" spellcheck="false"></textarea>
  </div>
  <div class="resizer" id="resizer"></div>
  <div class="output-pane">
    <div class="pane-header" id="out-label">Output</div>
    <div class="output-body" id="output">
      <div class="empty-state"><div class="empty-icon">{ }</div><div>Paste JSON on the left to get started</div></div>
    </div>
  </div>
</div>

<div class="statusbar" id="statusbar">
  <span>Ready</span>
</div>

<script>
let parsedData = null, currentView = 'tree', searchTerm = '', searchNodes = [], searchIdx = 0;

// ── Resizer ──
const resizer = document.getElementById('resizer');
const inputPane = document.getElementById('input-pane');
let dragging = false, startX = 0, startW = 0;
resizer.addEventListener('mousedown', e => { dragging=true; startX=e.clientX; startW=inputPane.offsetWidth; document.body.style.userSelect='none'; });
window.addEventListener('mousemove', e => { if(!dragging) return; inputPane.style.width = Math.max(160, Math.min(700, startW+(e.clientX-startX)))+'px'; });
window.addEventListener('mouseup', () => { dragging=false; document.body.style.userSelect=''; });

function normalizeRaw(str) {
  return str
    .replace(/^\uFEFF/, '')          // strip BOM
    .replace(/\r\n/g, '\n')          // CRLF → LF
    .replace(/\r/g, '\n')            // bare CR → LF
    .replace(/\u00A0/g, ' ')         // non-breaking space → regular space
    .replace(/[\u2018\u2019]/g, "'") // curly single quotes
    .replace(/[\u201C\u201D]/g, '"') // curly double quotes → straight
    .replace(/\u2028|\u2029/g, '\n') // unicode line/para separators
    .replace(/\uFFFD/g, '');         // replacement chars (encoding artifacts)
}

// Context-aware: only escapes bare control chars INSIDE JSON string literals.
function fixControlChars(str) {
  let out = '', inStr = false;
  for (let i = 0; i < str.length; i++) {
    const ch = str[i], code = ch.charCodeAt(0);
    if (inStr) {
      if (ch === '\\') { out += ch + (str[++i] || ''); continue; }
      if (ch === '"')  { inStr = false; out += ch; continue; }
      if (code < 0x20 && ch !== '\t') {
        out += '\\u' + code.toString(16).padStart(4, '0'); continue;
      }
    } else {
      if (ch === '"') inStr = true;
    }
    out += ch;
  }
  return out;
}

// Attempt to recover common hand-written / copy-pasted JSON mistakes.
function looseFix(str) {
  return str
    // trailing commas before ] or }
    .replace(/,(\s*[}\]])/g, '$1')
    // single-quoted strings → double-quoted (naïve but handles simple cases)
    .replace(/'([^'\\]*(\\.[^'\\]*)*)'/g, '"$1"')
    // unquoted keys: { key: value } → { "key": value }
    .replace(/([{,]\s*)([a-zA-Z_$][a-zA-Z0-9_$]*)(\s*:)/g, '$1"$2"$3');
}

function tryParse(str) {
  return JSON.parse(str); // throws on failure — caller handles
}

function onInput() {
  const raw = document.getElementById('json-input').value;
  if (!raw.trim()) { parsedData=null; renderEmpty(); setStatus('Ready'); return; }

  const attempts = [
    ()  => tryParse(raw),                              // 1. as-is
    ()  => tryParse(normalizeRaw(raw)),                // 2. normalize encoding
    ()  => tryParse(fixControlChars(raw)),             // 3. fix control chars
    ()  => tryParse(fixControlChars(normalizeRaw(raw))), // 4. normalize + fix
    ()  => tryParse(looseFix(normalizeRaw(raw))),      // 5. loose syntax fix
    ()  => tryParse(fixControlChars(looseFix(normalizeRaw(raw)))), // 6. all combined
  ];

  for (const attempt of attempts) {
    try { parsedData = attempt(); renderView(); setStatus('ok'); return; }
    catch(_) {}
  }

  // All passes failed — show the error from a clean parse for best message
  try { JSON.parse(normalizeRaw(raw)); } catch(e) {
    parsedData = null; renderError(e.message); setStatus('err', e.message);
  }
}

function beautify() {
  const inp = document.getElementById('json-input');
  const v = inp.value.trim();
  if (!v) return;
  const attempts = [
    () => JSON.parse(v),
    () => JSON.parse(normalizeRaw(v)),
    () => JSON.parse(fixControlChars(normalizeRaw(v))),
    () => JSON.parse(fixControlChars(looseFix(normalizeRaw(v)))),
  ];
  for (const attempt of attempts) {
    try { inp.value = JSON.stringify(attempt(), null, 2); onInput(); return; } catch(_) {}
  }
  setStatus('err', 'Could not parse JSON');
}

function clearAll() { document.getElementById('json-input').value=''; parsedData=null; renderEmpty(); setStatus('Ready'); document.getElementById('search').value=''; searchTerm=''; searchNodes=[]; document.getElementById('search-count').textContent=''; }

function setView(v) {
  currentView = v;
  ['tree','table','raw'].forEach(x => document.getElementById('btn-'+x).classList.toggle('active', x===v));
  if (parsedData !== null) renderView();
}

function renderView() {
  if (currentView==='tree') renderTree();
  else if (currentView==='table') renderTable();
  else renderRaw();
}

function renderEmpty() { document.getElementById('output').innerHTML='<div class="empty-state"><div class="empty-icon">{ }</div><div>Paste JSON on the left to get started</div></div>'; }
function renderError(msg) { document.getElementById('output').innerHTML=`<div class="empty-state"><div style="color:var(--err);font-size:32px">⚠</div><div style="color:var(--err)">Parse Error</div><div style="font-family:monospace;font-size:12px;color:var(--muted);max-width:400px;text-align:center">${esc(msg)}</div></div>`; }

function setStatus(type, msg='') {
  const sb = document.getElementById('statusbar');
  if (type==='ok') {
    const keys = countKeys(parsedData), depth = getDepth(parsedData);
    sb.innerHTML = `<span class="status-ok">✓ Valid JSON</span><span>Keys: ${keys}</span><span>Depth: ${depth}</span><span>Size: ${fmtSize(JSON.stringify(parsedData).length)}</span>`;
  } else if (type==='err') sb.innerHTML=`<span class="status-err">✗ ${esc(msg)}</span>`;
  else sb.innerHTML=`<span>Ready</span>`;
}

function countKeys(o, c=0) { if (Array.isArray(o)) { o.forEach(v=>c=countKeys(v,c)); return c; } if (o&&typeof o==='object') { c+=Object.keys(o).length; Object.values(o).forEach(v=>c=countKeys(v,c)); return c; } return c; }
function getDepth(o) { if (!o||typeof o!=='object') return 0; return 1+Math.max(0,...Object.values(o).map(getDepth)); }
function fmtSize(b) { return b<1024?b+'B':b<1048576?(b/1024).toFixed(1)+'KB':(b/1048576).toFixed(2)+'MB'; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Tree view ──
function renderTree() {
  const out = document.getElementById('output');
  const wrap = document.createElement('div');
  wrap.className = 'tree';
  wrap.appendChild(buildNode(parsedData, null));
  out.innerHTML = '';
  out.appendChild(wrap);
  if (searchTerm) applySearch();
}

function buildNode(val, key) {
  const node = document.createElement('div');
  node.className = 'node';
  const isObj = val && typeof val === 'object';

  if (isObj) {
    const isArr = Array.isArray(val);
    const kids = isArr ? val : Object.entries(val);
    const count = kids.length;
    const ob = isArr ? '[' : '{', cb = isArr ? ']' : '}';

    const row = document.createElement('div');
    row.className = 'node-row';
    const tog = document.createElement('span');
    tog.className = 'toggle';
    tog.textContent = '▾';
    tog.onclick = () => { node.classList.toggle('collapsed'); tog.style.transform = node.classList.contains('collapsed') ? 'rotate(-90deg)' : ''; };
    row.appendChild(tog);
    if (key !== null) { row.appendChild(span('key', esc(key))); row.appendChild(span('colon',':')); }
    row.appendChild(span('bracket', ob));
    row.appendChild(span('count-badge', count + (isArr?' items':' keys')));
    node.appendChild(row);

    const children = document.createElement('div');
    children.className = 'children';
    (isArr ? val.map((v,i)=>[i,v]) : Object.entries(val)).forEach(([k,v]) => children.appendChild(buildNode(v, k)));
    node.appendChild(children);

    const closeRow = document.createElement('div');
    closeRow.className = 'node-row';
    closeRow.appendChild(span('bracket', cb));
    node.appendChild(closeRow);
  } else {
    const row = document.createElement('div');
    row.className = 'node-row';
    row.appendChild(span('toggle', ''));
    if (key !== null) { row.appendChild(span('key', esc(key))); row.appendChild(span('colon',':')); }
    row.appendChild(buildValue(val));
    node.appendChild(row);
  }
  return node;
}

function span(cls, txt) { const s=document.createElement('span'); s.className=cls; s.innerHTML=txt; return s; }

function buildValue(v) {
  if (v === null) return span('null','null');
  if (typeof v === 'boolean') return span('bool', String(v));
  if (typeof v === 'number') return span('num', String(v));
  return span('str', '"'+esc(String(v))+'"');
}

function collapseAll() { document.querySelectorAll('.node').forEach(n => { n.classList.add('collapsed'); const t=n.querySelector('.toggle'); if(t) t.style.transform='rotate(-90deg)'; }); }
function expandAll() { document.querySelectorAll('.node').forEach(n => { n.classList.remove('collapsed'); const t=n.querySelector('.toggle'); if(t) t.style.transform=''; }); }

// ── Search ──
function onSearch(val) {
  searchTerm = val.toLowerCase().trim();
  searchNodes = []; searchIdx = 0;
  document.getElementById('search-count').textContent = '';
  if (parsedData !== null && currentView === 'tree') {
    if (searchTerm) applySearch(); else { renderTree(); }
  }
  if (parsedData !== null && currentView === 'raw') renderRaw();
}

function clearSearch() {
  document.getElementById('search-count').textContent = '';
}

// Recursively filter data to only nodes matching the search term.
// Returns filtered copy or null if no match.
function filterData(data, term) {
  if (Array.isArray(data)) {
    const arr = data.map(v => filterData(v, term)).filter(v => v !== null);
    // also include if array itself stringifies to a match
    return arr.length ? arr : (JSON.stringify(data).toLowerCase().includes(term) ? data : null);
  }
  if (data && typeof data === 'object') {
    const obj = {};
    for (const [k, v] of Object.entries(data)) {
      const keyMatch = k.toLowerCase().includes(term);
      const valMatch = typeof v !== 'object' && String(v).toLowerCase().includes(term);
      const childFiltered = (v && typeof v === 'object') ? filterData(v, term) : null;
      if (keyMatch || valMatch) obj[k] = v;
      else if (childFiltered !== null) obj[k] = childFiltered;
    }
    return Object.keys(obj).length ? obj : null;
  }
  // primitive
  return String(data).toLowerCase().includes(term) ? data : null;
}

function applySearch() {
  if (!searchTerm) { renderTree(); return; }
  const filtered = filterData(parsedData, searchTerm);
  const out = document.getElementById('output');
  if (!filtered && filtered !== 0 && filtered !== false) {
    out.innerHTML = `<div class="empty-state"><div style="font-size:32px">🔍</div><div>No matches for <strong>"${esc(searchTerm)}"</strong></div></div>`;
    document.getElementById('search-count').textContent = 'No match';
    return;
  }
  // Render filtered tree
  const wrap = document.createElement('div');
  wrap.className = 'tree';
  wrap.appendChild(buildNode(filtered, null));
  out.innerHTML = '';
  out.appendChild(wrap);
  // Highlight matches in the filtered tree
  searchNodes = [];
  out.querySelectorAll('.node-row').forEach(row => {
    const txt = row.textContent.toLowerCase();
    if (txt.includes(searchTerm)) {
      row.classList.add('highlighted');
      searchNodes.push(row);
      highlightText(row, searchTerm);
    }
  });
  const cnt = searchNodes.length;
  document.getElementById('search-count').textContent = cnt ? `${cnt} match${cnt>1?'es':''}` : 'No match';
  // scroll first match into view
  if (searchNodes[0]) searchNodes[0].scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function highlightText(el, term) {
  el.childNodes.forEach(child => {
    if (child.nodeType === 3) {
      const idx = child.textContent.toLowerCase().indexOf(term);
      if (idx < 0) return;
      const before = document.createTextNode(child.textContent.slice(0, idx));
      const mark = document.createElement('mark');
      mark.textContent = child.textContent.slice(idx, idx + term.length);
      const after = document.createTextNode(child.textContent.slice(idx + term.length));
      child.parentNode.replaceChild(after, child);
      child.parentNode.insertBefore(mark, after);
      child.parentNode.insertBefore(before, mark);
    } else if (child.nodeType === 1) highlightText(child, term);
  });
}

// ── Table view ──
function renderTable() {
  const out = document.getElementById('output');
  if (Array.isArray(parsedData) && parsedData.length && typeof parsedData[0]==='object' && parsedData[0]!==null) {
    const cols = [...new Set(parsedData.flatMap(r=>Object.keys(r)))];
    let html = '<div class="table-wrap"><table><thead><tr>';
    html += '<th>#</th>'+cols.map(c=>`<th>${esc(c)}</th>`).join('');
    html += '</tr></thead><tbody>';
    parsedData.forEach((row,i) => {
      html += `<tr><td style="color:var(--muted)">${i+1}</td>`;
      cols.forEach(c => { const v=row[c]; html+=`<td class="${valClass(v)}">${fmtCell(v)}</td>`; });
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    out.innerHTML = html;
  } else {
    out.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div>Table view works best with an array of objects</div></div>';
  }
}

function valClass(v) { if(v===null)return 'null'; if(typeof v==='boolean')return 'bool'; if(typeof v==='number')return 'num'; if(typeof v==='string')return 'str'; return ''; }
function fmtCell(v) { if(v===null)return '<em>null</em>'; if(typeof v==='object')return `<span style="color:var(--muted)">${esc(JSON.stringify(v))}</span>`; if(typeof v==='boolean')return `<span style="color:var(--bool)">${v}</span>`; if(typeof v==='number')return `<span style="color:var(--num)">${v}</span>`; return esc(String(v)); }

// ── Raw view ──
function renderRaw() {
  const out = document.getElementById('output');
  const raw = JSON.stringify(parsedData, null, 2);
  if (!searchTerm) { out.innerHTML=`<pre>${syntaxHL(esc(raw))}</pre>`; return; }
  const highlighted = esc(raw).replace(new RegExp(esc(searchTerm).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m=>`<mark>${m}</mark>`);
  out.innerHTML = `<pre>${syntaxHL(highlighted)}</pre>`;
  const cnt = (raw.toLowerCase().match(new RegExp(searchTerm.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'))||[]).length;
  document.getElementById('search-count').textContent = cnt ? `${cnt} match${cnt>1?'es':''}` : 'No match';
}

function syntaxHL(str) {
  return str
    .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?)/g, m => m.endsWith(':') ? `<span class="key">${m}</span>` : `<span class="str">${m}</span>`)
    .replace(/\b(true|false)\b/g, '<span class="bool">$1</span>')
    .replace(/\bnull\b/g, '<span class="null">null</span>')
    .replace(/\b(-?\d+\.?\d*(?:[eE][+-]?\d+)?)\b/g, '<span class="num">$1</span>');
}

// ── Sample ──
function loadSample() {
  document.getElementById('json-input').value = JSON.stringify({
    "store": {
      "name": "TechMart Kathmandu",
      "established": 2015,
      "active": true,
      "address": { "city": "Kathmandu", "district": "Bagmati", "zip": "44600" },
      "categories": ["Electronics","Software","Accessories"],
      "products": [
        { "id": 1, "name": "Laptop Pro 16", "price": 145000, "inStock": true, "tags": ["laptop","pro"] },
        { "id": 2, "name": "Mechanical Keyboard", "price": 8500, "inStock": false, "tags": ["keyboard","rgb"] },
        { "id": 3, "name": "4K Monitor", "price": 65000, "inStock": true, "tags": ["monitor","display"] }
      ],
      "discount": null
    }
  }, null, 2);
  onInput();
}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sample Widget Test Page</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f6f8fa;
      padding: 30px;
      margin: 0;
    }
    .test-widget-container {
      max-width: 500px;
      background: #fff;
      margin: 40px auto;
      border-radius: 8px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.07);
      padding: 32px 28px;
      text-align: center;
    }
    button {
      background: #0279f3;
      color: #fff;
      font-size: 16px;
      padding: 10px 22px;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 12px;
    }
    button:hover {
      background: #015ecd;
    }
    .counter-value {
      font-size: 28px;
      font-weight: 600;
      margin-top: 16px;
      margin-bottom: 8px;
      color: #222;
    }
  </style>
</head>
<body>
  <div class="test-widget-container">
    <h1>Sample Widget</h1>
    <div class="counter-value" id="counter">0</div>
    <button id="increment-btn">Increment</button>
  </div>
  <script>
    const counter = document.getElementById('counter');
    const incBtn = document.getElementById('increment-btn');
    let value = 0;
    incBtn.addEventListener('click', function() {
      value++;
      counter.textContent = value;
    });
  </script>
  <script> window.MyWidgetConfig = { apiKey: "key123", theme: "light" }; </script> <script src="http://localhost:3000/widget.js?pageSmartPageId=2a11474c-7b9b-4a36-ad5d-72b6928c4284"></script>
</body>
</html>

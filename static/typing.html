<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Speed Test</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  h1 {
    font-size: 1.8rem;
    font-weight: 700;
    color: #f8fafc;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }

  .subtitle {
    font-size: 0.85rem;
    color: #64748b;
    margin-bottom: 28px;
  }

  .card {
    background: #1e293b;
    border-radius: 16px;
    padding: 28px;
    width: 100%;
    max-width: 720px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  /* Stats row */
  .stats {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
  }

  .stat {
    flex: 1;
    background: #0f172a;
    border-radius: 10px;
    padding: 14px 10px;
    text-align: center;
  }

  .stat-value {
    font-size: 2rem;
    font-weight: 800;
    color: #38bdf8;
    line-height: 1;
  }

  .stat-value.green { color: #4ade80; }
  .stat-value.red   { color: #f87171; }
  .stat-value.yellow{ color: #fbbf24; }

  .stat-label {
    font-size: 0.7rem;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-top: 4px;
  }

  /* Passage display */
  .passage-wrap {
    background: #0f172a;
    border-radius: 10px;
    padding: 18px 20px;
    font-size: 1.05rem;
    line-height: 1.9;
    letter-spacing: 0.3px;
    margin-bottom: 16px;
    min-height: 90px;
    user-select: none;
    position: relative;
  }

  .char { color: #475569; }
  .char.correct { color: #4ade80; }
  .char.wrong   { color: #f87171; background: #3b0e0e; border-radius: 2px; }
  .char.cursor  { border-left: 2px solid #38bdf8; margin-left: -1px; animation: blink .7s infinite; }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* Input */
  #inp {
    width: 100%;
    background: #0f172a;
    border: 2px solid #334155;
    border-radius: 10px;
    color: #e2e8f0;
    font-size: 1rem;
    padding: 12px 16px;
    outline: none;
    transition: border-color .2s;
    resize: none;
    height: 52px;
    font-family: inherit;
  }

  #inp:focus { border-color: #38bdf8; }
  #inp:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Buttons */
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }

  button {
    flex: 1;
    padding: 11px;
    border-radius: 8px;
    border: none;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
  }

  button:hover { opacity: 0.88; }
  button:active { transform: scale(0.98); }

  #btn-reset {
    background: #38bdf8;
    color: #0f172a;
  }

  #btn-new {
    background: #334155;
    color: #e2e8f0;
  }

  /* Difficulty */
  .difficulty {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .diff-btn {
    flex: 1;
    padding: 7px;
    border-radius: 7px;
    border: 2px solid #334155;
    background: transparent;
    color: #94a3b8;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
  }

  .diff-btn.active {
    border-color: #38bdf8;
    color: #38bdf8;
    background: #0f172a;
  }

  /* Result overlay */
  #result {
    display: none;
    text-align: center;
    padding: 10px 0 6px;
  }

  #result.show { display: block; }

  #result h2 { font-size: 1.3rem; color: #f8fafc; margin-bottom: 4px; }
  #result p  { font-size: 0.85rem; color: #94a3b8; }

  .timer-bar-wrap {
    height: 4px;
    background: #1e293b;
    border-radius: 2px;
    margin-bottom: 16px;
    overflow: hidden;
  }

  #timer-bar {
    height: 100%;
    background: linear-gradient(90deg, #38bdf8, #818cf8);
    width: 100%;
    transition: width 1s linear;
    border-radius: 2px;
  }
</style>
</head>
<body>

<h1>⌨️ Typing Speed Test</h1>
<p class="subtitle">How fast can you type?</p>

<div class="card">

  <!-- Difficulty -->
  <div class="difficulty">
    <button class="diff-btn active" data-diff="easy">Easy</button>
    <button class="diff-btn" data-diff="medium">Medium</button>
    <button class="diff-btn" data-diff="hard">Hard</button>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="wpm-val">0</div>
      <div class="stat-label">WPM</div>
    </div>
    <div class="stat">
      <div class="stat-value green" id="acc-val">100%</div>
      <div class="stat-label">Accuracy</div>
    </div>
    <div class="stat">
      <div class="stat-value yellow" id="time-val">60</div>
      <div class="stat-label">Seconds Left</div>
    </div>
    <div class="stat">
      <div class="stat-value red" id="err-val">0</div>
      <div class="stat-label">Errors</div>
    </div>
  </div>

  <!-- Timer bar -->
  <div class="timer-bar-wrap">
    <div id="timer-bar"></div>
  </div>

  <!-- Passage -->
  <div class="passage-wrap" id="passage"></div>

  <!-- Input -->
  <textarea id="inp" placeholder="Start typing to begin the test…" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>

  <!-- Result -->
  <div id="result">
    <h2 id="result-msg"></h2>
    <p id="result-sub"></p>
  </div>

  <!-- Buttons -->
  <div class="actions">
    <button id="btn-reset">↺ Restart</button>
    <button id="btn-new">New Text</button>
  </div>

</div>

<script>
const PASSAGES = {
  easy: [
    "The sun rises every morning and sets every evening. Birds sing in the trees. Dogs run in the park. Children laugh and play outside. Life is simple and beautiful.",
    "Cats sleep for many hours each day. They love warm spots near windows. A cup of tea in the morning feels very nice. Good habits make life better every day.",
    "The sky is blue and the grass is green. Rain falls from dark clouds. After rain the air smells fresh and clean. A rainbow may appear if you are lucky.",
    "Reading books is a great hobby. It helps you learn new things and relax. Libraries are quiet places full of knowledge. Visit one whenever you get the chance.",
  ],
  medium: [
    "Technology has transformed the way we communicate and share information. Social media platforms connect billions of people across the globe instantly. However, spending too much time online can affect mental health and reduce productivity.",
    "The human brain is remarkably adaptable and continues to form new connections throughout life. Regular exercise, adequate sleep, and a healthy diet significantly improve cognitive performance and emotional well-being.",
    "Climate change poses one of the greatest challenges of our time. Rising temperatures and extreme weather events threaten ecosystems worldwide. Collective action from governments, businesses, and individuals is essential to address this crisis.",
    "Artificial intelligence is rapidly changing industries from healthcare to finance. Machine learning models can now diagnose diseases, detect fraud, and personalize content with impressive accuracy. The ethical implications must be carefully considered.",
  ],
  hard: [
    "Quantum mechanics fundamentally challenges our classical intuitions about reality. The superposition principle suggests particles can exist in multiple states simultaneously until observed, while entanglement implies instantaneous correlations across vast distances.",
    "The epistemological foundations of scientific inquiry rest upon falsifiability and reproducibility. Paradigm shifts, as described by Kuhn, occur when accumulated anomalies undermine prevailing theoretical frameworks, necessitating radical reconceptualization.",
    "Neuroplasticity refers to the brain's extraordinary capacity to reorganize synaptic connections in response to experience, injury, or environmental stimuli. This phenomenon underpins rehabilitation strategies for neurological disorders and cognitive enhancement techniques.",
    "Byzantine fault tolerance is a critical property in distributed computing systems, ensuring correct operation even when some nodes behave arbitrarily or maliciously. Consensus algorithms like PBFT achieve agreement despite up to one-third faulty participants.",
  ]
};

const TIME_LIMIT = 60;

let passage = '';
let typed = 0;
let errors = 0;
let timer = null;
let timeLeft = TIME_LIMIT;
let started = false;
let finished = false;
let diff = 'easy';

const passageEl = document.getElementById('passage');
const inp       = document.getElementById('inp');
const wpmVal    = document.getElementById('wpm-val');
const accVal    = document.getElementById('acc-val');
const timeVal   = document.getElementById('time-val');
const errVal    = document.getElementById('err-val');
const timerBar  = document.getElementById('timer-bar');
const resultEl  = document.getElementById('result');
const resultMsg = document.getElementById('result-msg');
const resultSub = document.getElementById('result-sub');

function pickPassage() {
  const list = PASSAGES[diff];
  return list[Math.floor(Math.random() * list.length)];
}

function renderPassage(typed) {
  passageEl.innerHTML = passage.split('').map((ch, i) => {
    let cls = 'char';
    if (i < typed.length) {
      cls += typed[i] === ch ? ' correct' : ' wrong';
    } else if (i === typed.length) {
      cls += ' cursor';
    }
    return `<span class="${cls}">${ch === ' ' ? '&nbsp;' : ch}</span>`;
  }).join('');
}

function calcWPM() {
  const elapsed = (TIME_LIMIT - timeLeft) || 1;
  const words = typed / 5;
  return Math.round((words / elapsed) * 60);
}

function calcAcc() {
  if (typed === 0) return 100;
  return Math.round(((typed - errors) / typed) * 100);
}

function updateStats(typedCount) {
  wpmVal.textContent = started ? calcWPM() : 0;
  accVal.textContent = calcAcc() + '%';
  errVal.textContent = errors;
}

function startTimer() {
  timer = setInterval(() => {
    timeLeft--;
    timeVal.textContent = timeLeft;
    timerBar.style.width = (timeLeft / TIME_LIMIT * 100) + '%';
    updateStats(typed);
    if (timeLeft <= 0) endTest();
  }, 1000);
}

function endTest() {
  clearInterval(timer);
  finished = true;
  inp.disabled = true;
  const wpm = calcWPM();
  const acc = calcAcc();
  let emoji = wpm >= 70 ? '🚀' : wpm >= 40 ? '👍' : '💪';
  resultMsg.textContent = `${emoji} ${wpm} WPM — ${acc}% Accuracy`;
  resultSub.textContent = `You made ${errors} error${errors !== 1 ? 's' : ''}. ${getRating(wpm)}`;
  resultEl.classList.add('show');
}

function getRating(wpm) {
  if (wpm >= 100) return 'Outstanding — professional typist level!';
  if (wpm >= 70)  return 'Excellent speed!';
  if (wpm >= 50)  return 'Above average. Keep practicing!';
  if (wpm >= 30)  return 'Average speed. Room to improve.';
  return 'Keep practicing — you will get faster!';
}

function reset(newText = false) {
  clearInterval(timer);
  if (newText) passage = pickPassage();
  typed = 0; errors = 0; timeLeft = TIME_LIMIT;
  started = false; finished = false;
  inp.value = '';
  inp.disabled = false;
  timerBar.style.width = '100%';
  timerBar.style.transition = 'none';
  setTimeout(() => timerBar.style.transition = 'width 1s linear', 50);
  wpmVal.textContent = '0';
  accVal.textContent = '100%';
  timeVal.textContent = TIME_LIMIT;
  errVal.textContent  = '0';
  resultEl.classList.remove('show');
  renderPassage('');
  inp.focus();
}

inp.addEventListener('input', e => {
  if (finished) return;
  const val = inp.value;

  if (!started && val.length > 0) {
    started = true;
    startTimer();
  }

  typed = val.length;
  errors = 0;
  for (let i = 0; i < val.length; i++) {
    if (val[i] !== passage[i]) errors++;
  }

  renderPassage(val);
  updateStats(typed);

  // Finished passage early
  if (val.length >= passage.length) {
    endTest();
  }
});

// Prevent paste
inp.addEventListener('paste', e => e.preventDefault());

document.getElementById('btn-reset').addEventListener('click', () => reset(false));
document.getElementById('btn-new').addEventListener('click', () => reset(true));

document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    diff = btn.dataset.diff;
    reset(true);
  });
});

// Init
passage = pickPassage();
renderPassage('');
inp.focus();
</script>
</body>
</html>
